[build]
  command = "npm run build"
  publish = "dist"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[[redirects]]
  from = "/api/sarang-naga/status"
  to = "/.netlify/functions/sarang-naga-status"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
